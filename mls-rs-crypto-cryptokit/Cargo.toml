[package]
name = "mls-rs-crypto-cryptokit"
version = "0.11.0"
edition = "2021"
description = "CryptoKit based CryptoProvider for mls-rs"
homepage = "https://github.com/awslabs/mls-rs"
repository = "https://github.com/awslabs/mls-rs"
keywords = ["mls", "mls-rs", "CryptoKit"]
license = "Apache-2.0 OR MIT"

[features]
default = ["std"]
std = ["dep:thiserror", "mls-rs-core/std", "mls-rs-crypto-traits/std"]
post-quantum = ["dep:mls-rs-crypto-hpke", "mls-rs-core/post-quantum"]
# macOS-only; enables cross-provider interop tests between this provider and mls-rs-crypto-awslc.
# Not used in iOS builds or production; opt-in only.
awslc-interop = ["dep:mls-rs-crypto-awslc", "post-quantum"]

[build-dependencies]
# For parsing Swift outputs to build and link the bridge library
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
hex-literal = "1"
assert_matches = "1.5.0"
mls-rs-core = { path = "../mls-rs-core", version = "0.27.0", features = [
  "test_suite",
] }
# The swift-mls format-2 export fixture producer (`tests/swift_export_pq.rs`):
# a full ML-KEM-768 group export needs a real `Group` backed by this crate's
# PQ provider, since only its 96-byte secret form is migratable.
mls-rs = { path = "../mls-rs", version = "0.55.3", features = ["swift_export"] }
hex = { version = "^0.4.3", default-features = false, features = ["std"] }
serde = "1.0"
serde_json = "1.0"
ciborium = "0.2"

[dependencies]
maybe-async = "0.2.10"
mls-rs-core = { path = "../mls-rs-core", default-features = false, version = "0.27.0" }
mls-rs-crypto-traits = { path = "../mls-rs-crypto-traits", default-features = false, version = "0.22.0" }
mls-rs-crypto-hpke = { path = "../mls-rs-crypto-hpke", default-features = false, version = "0.21.0", optional = true }
mls-rs-crypto-awslc = { path = "../mls-rs-crypto-awslc", default-features = false, version = "0.25.0", features = [
  "non-fips",
  "post-quantum",
], optional = true }
thiserror = { version = "2", optional = true }
zeroize = { version = "1", default-features = false, features = [
  "alloc",
  "zeroize_derive",
] }

[target.'cfg(mls_build_async)'.dependencies]
async-trait = "0.1.74"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mls_build_async)'] }
